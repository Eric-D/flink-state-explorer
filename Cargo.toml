[package]
name = "flink-explorer"
version = "0.1.1"
edition = "2021"
description = "TUI tool for exploring Apache Flink 1.20 savepoints interactively"

[features]
# RocksDB/SST reading (for external state files) is off by default: the canonical
# heap-savepoint path never uses it, and dropping it keeps the default build pure-Rust
# (no C++/libclang) so it cross-compiles to Windows trivially. Enable with `--features sst`.
default = []
sst = ["dep:rocksdb"]
# Parquet output for `--export-state --format parquet`. Off by default: arrow+parquet pull ~36
# crates the TUI has no use for. `cargo audit`/`cargo deny` are clean on that tree.
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rocksdb = { version = "0.24", features = ["snappy"], optional = true }
protox = "0.9"
prost-reflect = "0.16"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde_json = "1.0.149"
# Per-key-group snapshot compression: Flink wraps each key-group in a Snappy *framed*
# stream (SnappyStreamCompressionDecorator -> SnappyFramedOutputStream), which is what
# snap::read::FrameDecoder reads. Pure Rust, no C dependency.
snap = "1"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"], optional = true }
arrow-array = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }

[dev-dependencies]
# Build a Snappy-framed key-group in tests, to prove the compressed path decodes.
snap = "1"
