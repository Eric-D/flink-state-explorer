name: Release
on:
  push: { tags: ['v*'] }
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: flink-explorer
            asset: flink-explorer-${{ github.ref_name }}-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: flink-explorer.exe
            asset: flink-explorer-${{ github.ref_name }}-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: flink-explorer
            asset: flink-explorer-${{ github.ref_name }}-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.asset }}', path: 'dist/${{ matrix.asset }}' }
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: flink-explorer ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
