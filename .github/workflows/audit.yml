name: Security audit
on:
  push: { branches: [main], paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml'] }
  # Sans ce trigger, un bump de dépendance n'était pas audité avant merge et une
  # nouvelle advisory n'apparaissait qu'au run hebdo sur main (passé inaperçu 4 semaines).
  pull_request: { paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml'] }
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with: { token: '${{ secrets.GITHUB_TOKEN }}' }
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }
